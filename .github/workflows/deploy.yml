name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Validate ref is a tag
        if: github.ref_type != 'tag'
        run: |
          echo "This workflow must run from a tag."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Fetch all history for all tags and branches

      - name: Check format of received tag
        id: check-version-tag
        uses: AbsaOSS/version-tag-check@4145e48bf3f77a5afff2ec9afdd8afb6b53bce34 # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-repository: ${{ github.repository }}
          version-tag: ${{ github.ref_name }}
          should-exist: 'true'

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Import GPG keys
        run: |
          echo "${{ secrets.PGP_SECRET }}" | base64 --decode | gpg --batch --import

      - name: Create settings.xml
        run: |
          echo "<settings xmlns=\"http://maven.apache.org/SETTINGS/1.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd\">
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.SONATYPE_USERNAME }}</username>
                <password>${{ secrets.SONATYPE_PASSWORD }}</password>
              </server>
            </servers>
          </settings>" > $HOME/.m2/settings.xml

      - name: Build and deploy artifact
        if: false
        env:
          GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: mvn -B -e -DskipTests -Pdeploy clean deploy
